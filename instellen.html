<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1726">
  <title>Volley · koppelen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="midden">
    <div class="vink wacht" id="vink">🏐</div>
    <h1 id="kop">Volley koppelen</h1>
    <p id="uitleg">Open de koppellink die je van Vik kreeg, op je gsm en op je computer. Daarna weet dit toestel waar je filmpjes staan.</p>
    <p id="verder" hidden><a href="./">Naar je training</a> · <a href="kies.html">Filmpjes kiezen</a></p>
    <p id="demo"><a href="#demo">Of probeer het eerst met voorbeeldfilmpjes</a></p>
  </div>

  <script src="app.js"></script>
  <script>
    V.registreer();
    const $ = id => document.getElementById(id);

    function lees() {
      const h = location.hash.slice(1);
      if (!h) return;
      if (h === 'demo') {
        V.koppel('demo', '');
      } else {
        const q = new URLSearchParams(h);
        if (!q.get('api') || !q.get('k')) return;
        V.koppel(q.get('api'), q.get('k'));
      }
      history.replaceState(null, '', location.pathname); // de sleutel niet in de adresbalk laten staan
      toon();
    }

    function toon() {
      if (!V.gekoppeld()) return;
      $('vink').className = 'vink';
      $('vink').textContent = '✓';
      $('kop').textContent = 'Gekoppeld';
      $('uitleg').textContent = V.isDemo()
        ? 'Dit toestel toont nu voorbeeldfilmpjes. Open later de echte koppellink om je eigen filmpjes te zien.'
        : 'Dit toestel weet nu waar je filmpjes staan.';
      $('verder').hidden = false;
      $('demo').hidden = true;
    }

    window.addEventListener('hashchange', lees);
    lees();
    toon();
  </script>
</body>
</html>
