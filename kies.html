<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1726">
  <title>Volley · kiezen</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="balk">
    <a class="logo" href="./"><img src="icon-192.png" alt="">Volley</a>
    <nav><a href="./">Training</a><a href="kies.html" class="nu">Kiezen</a></nav>
  </header>

  <main class="kiezen">
    <section>
      <div class="filters" id="filters">
        <button data-f="week" class="nu">Deze week</button>
        <button data-f="alles">Alles</button>
        <button data-f="verborgen">Verborgen</button>
        <span class="aantal" id="aantal"></span>
      </div>
      <div class="filters soorten" id="soorten"></div>
      <div class="raster" id="raster"><div class="melding">Even laden…</div></div>
    </section>

    <aside class="training">
      <input class="tnaam" id="tnaam" aria-label="Naam van de training">
      <ol id="lijst"></ol>
      <div class="rij">
        <button class="knop" id="orden" title="Zet de training in de juiste volgorde volgens de kernwoorden">Orden: opwarming eerst, game-like laatst</button>
      </div>
      <div class="rij">
        <button class="knop geel groot" id="zet">Zet op mijn gsm</button>
      </div>
      <div class="rij">
        <button class="knop" id="nieuw">Nieuwe training</button>
      </div>
      <div class="status" id="status"></div>
    </aside>
  </main>
  <p class="onder" id="onder"></p>

  <script src="app.js"></script>
  <script>
    V.registreer();
    const $ = id => document.getElementById(id);
    const el = V.el;

    let filmpjes = [];
    let gekozen = [];        // ids, in volgorde
    let filter = 'week';
    let opgeslagen = true;   // is wat links staat ook wat op de gsm staat?
    let soort = '';          // filter op kernwoord

    // Kernwoorden: de vaste eerst, daarna wat Bart er zelf bij typte.
    const BASIS = ['Opwarming', 'Onderhands', 'Bovenhands', 'Opslag', 'Game-like'];
    const labelsVan = f => Array.isArray(f.labels) ? f.labels : [];
    const heeft = (f, l) => labelsVan(f).some(x => x.toLowerCase() === l.toLowerCase());
    function alleLabels() {
      const uit = BASIS.slice();
      filmpjes.forEach(f => labelsVan(f).forEach(l => { if (!uit.some(x => x.toLowerCase() === l.toLowerCase())) uit.push(l); }));
      return uit;
    }
    // Plaats in de training: opwarming vooraan, game-like achteraan, de rest ertussen.
    function fase(f) {
      const l = labelsVan(f).map(x => x.toLowerCase());
      if (l.includes('game-like')) return 5;
      if (l.includes('opwarming')) return 0;
      if (l.includes('onderhands')) return 1;
      if (l.includes('bovenhands')) return 2;
      if (l.includes('opslag')) return 3;
      return 4;
    }

    const perId = () => Object.fromEntries(filmpjes.map(f => [f.id, f]));
    const vandaag = () => 'Training ' + V.datum(new Date().toISOString(), true);

    // ---------- de filmpjes ----------

    const sterrenVan = f => Math.max(0, Math.min(5, parseInt(f.sterren, 10) || 0));
    // Beste eerst, daarna de nieuwste.
    const sorteer = l => l.slice().sort((a, b) => sterrenVan(b) - sterrenVan(a) || String(b.bewaard).localeCompare(String(a.bewaard)));

    function zichtbaar() {
      const week = Date.now() - 7 * 864e5;
      const metSoort = l => soort ? l.filter(f => heeft(f, soort)) : l;
      if (filter === 'verborgen') return metSoort(filmpjes.filter(f => f.verborgen));
      const actief = metSoort(filmpjes.filter(f => !f.verborgen));
      if (filter === 'week') return actief.filter(f => new Date(f.bewaard).getTime() >= week);
      return actief;
    }

    // De groep van een filmpje, in de volgorde van een training.
    function groep(f) {
      const l = labelsVan(f).filter(x => x.toLowerCase() !== 'van vik');
      const lk = l.map(x => x.toLowerCase());
      for (const g of ['game-like', 'opwarming', 'onderhands', 'bovenhands', 'opslag']) {
        if (lk.includes(g)) return BASIS.find(b => b.toLowerCase() === g);
      }
      return l[0] || 'Nog zonder kernwoord';
    }
    function groepVolgorde() {
      const eigen = alleLabels().filter(l => !BASIS.includes(l) && l.toLowerCase() !== 'van vik');
      return ['Opwarming', 'Onderhands', 'Bovenhands', 'Opslag', ...eigen, 'Game-like', 'Nog zonder kernwoord'];
    }

    function tekenSoorten() {
      const bar = $('soorten');
      bar.replaceChildren();
      const knop = (t, waarde) => {
        const b = el('button', { class: soort === waarde ? 'nu' : '' }, t);
        b.onclick = () => { soort = soort === waarde ? '' : waarde; tekenRaster(); };
        return b;
      };
      bar.append(knop('Alle soorten', ''));
      alleLabels().forEach(l => bar.append(knop(l, l)));
    }

    // Voorvertoning: een filmpje speelt zonder geluid zodra het in beeld komt, en stopt als het uit beeld gaat.
    const kijker = 'IntersectionObserver' in window ? new IntersectionObserver(items => {
      items.forEach(it => { if (it.isIntersecting) it.target._laad(); else it.target._los(); });
    }, { rootMargin: '120px 0px', threshold: 0.25 }) : null;

    function kaart(f) {
      const adres = V.speler(f, { auto: true });
      const bron = () => el('span', { class: 'bron' }, V.bronNaam[f.bron] || 'Link');
      const rust = () => [
        f.beeld ? el('img', { src: f.beeld, alt: '', loading: 'lazy', onerror: e => e.target.remove() }) : el('div', { class: 'leeg' }, f.maker || V.bronNaam[f.bron] || 'Link'),
        bron(),
        el('span', { class: 'speel' }, adres ? '▶' : '↗')
      ];
      const beeld = el('div', { class: 'beeld', title: adres ? '' : 'Open het filmpje' }, ...rust());
      beeld._laad = () => {
        if (!adres || beeld.querySelector('iframe')) return;
        beeld.replaceChildren(el('iframe', { src: adres, allow: 'autoplay; encrypted-media; fullscreen', allowfullscreen: true, title: V.naamVan(f), loading: 'lazy' }), bron());
      };
      beeld._los = () => { if (beeld.querySelector('iframe')) beeld.replaceChildren(...rust()); };
      beeld.onclick = () => { if (!adres) { window.open(f.link, '_blank', 'noopener'); return; } beeld._laad(); };
      if (kijker && adres) kijker.observe(beeld);

      const naam = el('input', { class: 'naam', value: f.naam || '', placeholder: 'Geef het een naam', 'aria-label': 'Naam van de oefening' });
      naam.onchange = async () => {
        f.naam = naam.value.trim();
        tekenLijst();
        try { await V.wijzig(f.id, { naam: f.naam }); } catch (e) { status('De naam is niet bewaard. Probeer opnieuw.', true); }
      };
      naam.onkeydown = e => { if (e.key === 'Enter') naam.blur(); };

      // sterren: hoe goed vind je de oefening? Nog eens op dezelfde ster klikken haalt ze weg.
      const sterren = el('div', { class: 'sterren', title: 'Hoe goed vind je deze oefening?' });
      const tekenSterren = () => {
        sterren.replaceChildren();
        const n = sterrenVan(f);
        for (let i = 1; i <= 5; i++) {
          const b = el('button', { type: 'button', class: i <= n ? 'aan' : '', 'aria-label': i === 1 ? '1 ster' : i + ' sterren' }, '★');
          b.onclick = async () => {
            f.sterren = sterrenVan(f) === i ? 0 : i;
            tekenSterren();
            try { await V.wijzig(f.id, { sterren: f.sterren }); } catch (e) { status('De sterren zijn niet bewaard. Probeer opnieuw.', true); }
          };
          sterren.append(b);
        }
      };
      tekenSterren();

      // kernwoorden: wat aan staat; met ✎ pas je ze aan. Zonder kernwoord staan alle keuzes meteen open.
      const chips = el('div', { class: 'labels' });
      let bewerk = !labelsVan(f).some(x => x.toLowerCase() !== 'van vik');
      const tekenChips = () => {
        chips.replaceChildren();
        if (!bewerk) {
          labelsVan(f).forEach(l => chips.append(el('span', { class: 'chip aan vast' }, l)));
          const pen = el('button', { class: 'chip plus', type: 'button', title: 'Kernwoorden aanpassen' }, '✎');
          pen.onclick = () => { bewerk = true; tekenChips(); };
          chips.append(pen);
          return;
        }
        alleLabels().forEach(l => {
          const aan = heeft(f, l);
          const b = el('button', { class: 'chip' + (aan ? ' aan' : ''), type: 'button' }, l);
          b.onclick = () => zetLabel(l, !aan);
          chips.append(b);
        });
        const plus = el('button', { class: 'chip plus', type: 'button', title: 'Eigen kernwoord' }, '+');
        plus.onclick = () => {
          const inp = el('input', { class: 'chip-in', placeholder: 'Kernwoord', maxlength: '30' });
          let klaar = false;
          const af = () => {
            if (klaar) return;
            klaar = true;
            const t = inp.value.trim();
            if (t) zetLabel(t, true); else tekenChips();
          };
          inp.onkeydown = e => { if (e.key === 'Enter') af(); if (e.key === 'Escape') { inp.value = ''; af(); } };
          inp.onblur = af;
          plus.replaceWith(inp);
          inp.focus();
        };
        chips.append(plus);
        if (labelsVan(f).length) {
          const ok = el('button', { class: 'chip plus', type: 'button', title: 'Klaar' }, '✓');
          ok.onclick = () => { bewerk = false; tekenChips(); };
          chips.append(ok);
        }
      };
      const zetLabel = async (l, aan) => {
        const nu = labelsVan(f).filter(x => x.toLowerCase() !== l.toLowerCase());
        if (aan) nu.push(l);
        f.labels = nu;
        tekenChips(); tekenLijst(); tekenSoorten();
        try { await V.wijzig(f.id, { labels: f.labels }); } catch (e) { status('Het kernwoord is niet bewaard. Probeer opnieuw.', true); }
      };
      tekenChips();

      const zit = gekozen.includes(f.id);
      const voeg = el('button', { class: 'knop' + (zit ? '' : ' geel') }, zit ? 'Erin ✓' : '+ In training');
      voeg.onclick = () => {
        if (gekozen.includes(f.id)) gekozen = gekozen.filter(x => x !== f.id);
        else voegToe(f.id);
        gewijzigd();
      };
      const verberg = el('button', { class: 'knop klein', title: f.verborgen ? 'Terugzetten' : 'Verbergen' }, f.verborgen ? 'Terug' : 'Verberg');
      const k = el('div', { class: 'kaart' + (zit ? ' gekozen' : ''), 'data-id': f.id },
        beeld,
        el('div', { class: 'info' },
          naam,
          sterren,
          chips,
          el('div', { class: 'meta' }, [f.maker, 'bewaard ' + V.datum(f.bewaard, true)].filter(Boolean).join(' · ')),
          el('div', { class: 'knoppen' }, voeg, verberg)));
      verberg.onclick = async () => {
        f.verborgen = !f.verborgen;
        if (f.verborgen) gekozen = gekozen.filter(x => x !== f.id);
        if (kijker) kijker.unobserve(beeld);
        k.remove();
        tekenAantal(zichtbaar().length);
        tekenLijst();
        try { await V.wijzig(f.id, { verborgen: f.verborgen }); } catch (e) { status('Dat is niet bewaard. Probeer opnieuw.', true); }
      };
      return k;
    }

    function tekenAantal(n) { $('aantal').textContent = n === 1 ? '1 filmpje' : n + ' filmpjes'; }

    function tekenRaster() {
      tekenSoorten();
      if (kijker) kijker.disconnect();
      const lijst = sorteer(zichtbaar());
      tekenAantal(lijst.length);
      const raster = $('raster');
      raster.replaceChildren();
      if (!lijst.length) {
        const leeg = filter === 'week' && filmpjes.some(f => !f.verborgen)
          ? 'Deze week heb je nog niets bewaard. Kijk bij Alles.'
          : soort ? 'Geen filmpjes met het kernwoord ' + soort + '.'
          : filter === 'verborgen' ? 'Niets verborgen.' : 'Nog geen filmpjes. Tik in Instagram of TikTok op Delen en kies Volley.';
        raster.append(el('div', { class: 'melding' }, leeg));
        return;
      }
      if (soort || filter === 'verborgen') { lijst.forEach(f => raster.append(kaart(f))); return; }
      // Per soort, in de volgorde van een training; binnen elke soort de beste eerst.
      const namen = {};
      const groepen = new Map();
      groepVolgorde().forEach(g => { namen[g.toLowerCase()] = g; groepen.set(g.toLowerCase(), []); });
      lijst.forEach(f => {
        const g = groep(f).toLowerCase();
        if (!groepen.has(g)) { groepen.set(g, []); namen[g] = groep(f); }
        groepen.get(g).push(f);
      });
      groepen.forEach((l, g) => {
        if (!l.length) return;
        raster.append(el('h3', { class: 'groep' }, namen[g], el('span', {}, ' · ' + l.length)));
        l.forEach(f => raster.append(kaart(f)));
      });
    }

    // Een filmpje dat je toevoegt, komt meteen op de juiste plaats: na dezelfde soort, voor wat later in de training komt.
    function voegToe(id) {
      const p = perId();
      const fz = fase(p[id]);
      let pos = gekozen.findIndex(x => p[x] && fase(p[x]) > fz);
      if (pos < 0) pos = gekozen.length;
      gekozen.splice(pos, 0, id);
    }

    // Na een wijziging in de training: alleen de knoppen bijwerken, zodat de filmpjes blijven spelen.
    function werkKaartenBij() {
      document.querySelectorAll('#raster .kaart').forEach(k => {
        const zit = gekozen.includes(k.dataset.id);
        k.classList.toggle('gekozen', zit);
        const b = k.querySelector('.knoppen .knop');
        if (!b) return;
        b.textContent = zit ? 'Erin ✓' : '+ In training';
        b.classList.toggle('geel', !zit);
      });
    }

    // ---------- de training ----------

    let sleepId = null;
    function tekenLijst() {
      const p = perId();
      gekozen = gekozen.filter(id => p[id]);
      const ol = $('lijst');
      ol.replaceChildren();
      if (!gekozen.length) {
        ol.append(el('div', { class: 'leeg' }, 'Klik op "+ In training" bij een filmpje. Sleep om de volgorde te veranderen.'));
      }
      gekozen.forEach((id, i) => {
        const f = p[id];
        const op = el('button', { title: 'Hoger', 'aria-label': 'Hoger' }, '↑');
        const neer = el('button', { title: 'Lager', 'aria-label': 'Lager' }, '↓');
        const weg = el('button', { title: 'Eruit', 'aria-label': 'Eruit' }, '✕');
        op.onclick = () => schuif(i, i - 1);
        neer.onclick = () => schuif(i, i + 1);
        weg.onclick = () => { gekozen.splice(i, 1); gewijzigd(); };
        const li = el('li', { draggable: 'true', 'data-id': id },
          el('span', { class: 'nr' }, String(i + 1)),
          el('span', { class: 't' }, V.naamVan(f), el('small', {}, [labelsVan(f).join(', '), V.bronNaam[f.bron]].filter(Boolean).join(' · '))),
          el('span', { class: 'mini' }, op, neer, weg));
        li.addEventListener('dragstart', e => { sleepId = id; li.classList.add('sleep'); e.dataTransfer.effectAllowed = 'move'; });
        li.addEventListener('dragend', () => { sleepId = null; li.classList.remove('sleep'); });
        li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('boven'); });
        li.addEventListener('dragleave', () => li.classList.remove('boven'));
        li.addEventListener('drop', e => {
          e.preventDefault(); li.classList.remove('boven');
          if (!sleepId || sleepId === id) return;
          const van = gekozen.indexOf(sleepId);
          gekozen.splice(van, 1);
          gekozen.splice(gekozen.indexOf(id), 0, sleepId);
          gewijzigd();
        });
        ol.append(li);
      });
      $('orden').disabled = gekozen.length < 2;
      $('zet').disabled = !gekozen.length;
      $('zet').textContent = gekozen.length ? `Zet op mijn gsm (${gekozen.length})` : 'Zet op mijn gsm';
    }

    function schuif(van, naar) {
      if (naar < 0 || naar >= gekozen.length) return;
      const [x] = gekozen.splice(van, 1);
      gekozen.splice(naar, 0, x);
      gewijzigd();
    }

    function gewijzigd() {
      opgeslagen = false;
      status('');
      tekenLijst();
      werkKaartenBij();
    }

    function status(t, fout = false) {
      $('status').textContent = t;
      $('status').className = 'status' + (fout ? ' fout' : '');
    }

    $('zet').onclick = async () => {
      $('zet').disabled = true;
      status('Bezig…');
      try {
        const naam = $('tnaam').value.trim() || vandaag();
        await V.training(naam, gekozen);
        opgeslagen = true;
        const u = new Date();
        status(`Staat op je gsm (${u.getHours()}u${String(u.getMinutes()).padStart(2, '0')}). Open Volley op je gsm.`);
      } catch (e) {
        status('Niet gelukt. Is er internet? Probeer opnieuw.', true);
      }
      $('zet').disabled = !gekozen.length;
    };

    $('orden').onclick = () => {
      const p = perId();
      gekozen = gekozen.map((id, i) => [id, i])
        .sort((a, b) => fase(p[a[0]]) - fase(p[b[0]]) || a[1] - b[1])
        .map(x => x[0]);
      gewijzigd();
    };

    $('nieuw').onclick = () => {
      if (gekozen.length && !opgeslagen && !confirm('Je lijst is nog niet op je gsm gezet. Toch leegmaken?')) return;
      gekozen = [];
      $('tnaam').value = vandaag();
      gewijzigd();
    };
    $('tnaam').oninput = () => { opgeslagen = false; status(''); };

    $('filters').onclick = e => {
      const b = e.target.closest('button');
      if (!b) return;
      filter = b.dataset.f;
      document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('nu', x === b));
      tekenRaster();
    };

    window.addEventListener('beforeunload', e => {
      if (gekozen.length && !opgeslagen) { e.preventDefault(); e.returnValue = ''; }
    });

    (async () => {
      if (!V.gekoppeld()) { location.href = 'instellen.html'; return; }
      if (V.isDemo()) $('onder').textContent = 'Je kijkt naar voorbeeldfilmpjes. Je eigen filmpjes komen er na het koppelen.';
      await V.wachtrij.verstuur();
      try {
        const j = await V.lijst();
        filmpjes = j.filmpjes || [];
        if (j.training) { gekozen = j.training.filmpjes.slice(); $('tnaam').value = j.training.naam; }
        else $('tnaam').value = vandaag();
        if (!filmpjes.some(f => !f.verborgen && new Date(f.bewaard).getTime() >= Date.now() - 7 * 864e5) && filmpjes.length) {
          filter = 'alles';
          document.querySelectorAll('#filters button').forEach(x => x.classList.toggle('nu', x.dataset.f === 'alles'));
        }
        tekenRaster();
        tekenLijst();
        // Wat je intussen op je gsm deelt, verschijnt hier vanzelf (elke 10 seconden, en als je terugkomt naar dit tabblad).
        setInterval(kijkNieuw, 10000);
        document.addEventListener('visibilitychange', kijkNieuw);
        window.addEventListener('focus', kijkNieuw);
      } catch (e) {
        $('raster').replaceChildren(el('div', { class: 'melding' }, 'Ik kan je filmpjes nu niet ophalen. Is er internet? Herlaad de pagina.'));
      }
    })();

    let bezigNieuw = false;
    async function kijkNieuw() {
      if (document.hidden || bezigNieuw) return;
      if (document.activeElement && document.activeElement.matches('.raster input')) return; // niet storen tijdens het typen
      bezigNieuw = true;
      try {
        const j = await V.lijst();
        const bekend = new Set(filmpjes.map(f => f.id));
        const nieuw = (j.filmpjes || []).filter(f => !bekend.has(f.id));
        if (nieuw.length) {
          filmpjes = nieuw.concat(filmpjes);
          tekenRaster();
        }
      } catch (e) { /* volgende keer opnieuw */ }
      bezigNieuw = false;
    }
  </script>
</body>
</html>
